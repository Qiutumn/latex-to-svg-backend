# Whether a TeX package update makes the stamp of a `.fmt' file stale, on
# each distribution's own TeX packages.  The stamp records the `ls-R'
# index of each TeX tree the dump read from, on the assumption that the
# package manager's hooks run `mktexlsr' after an install or update.
#
# That is a property of the distributions, not of this code, so it runs
# on demand and once a month rather than on every push: each job installs
# TeX from scratch in a container of the distribution.  GitHub runs those
# two only from the default branch, so a push that changes this file runs
# it too, on any branch.

name: Distributions

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'
  push:
    paths:
      - .github/workflows/distributions.yml

jobs:
  stamp:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The TeX packages are what the default preamble needs:
          # standalone, varwidth, amsmath, amssymb and xcolor.  The second
          # install is any TeX package the first did not bring in.
          - name: Ubuntu (apt)
            image: ubuntu:latest
            install: >-
              apt-get update &&
              apt-get install --yes --no-install-recommends
              emacs-nox texlive-latex-base texlive-latex-recommended
              texlive-latex-extra texlive-fonts-recommended
            install-more: >-
              apt-get install --yes --no-install-recommends texlive-games
          - name: Fedora (dnf)
            image: fedora:latest
            install: >-
              dnf install --assumeyes emacs-nox texlive-scheme-basic
              texlive-standalone texlive-varwidth texlive-xcolor
              texlive-amsfonts
            install-more: dnf install --assumeyes texlive-collection-games
          - name: Arch (pacman)
            image: archlinux:latest
            install: >-
              pacman -Syu --noconfirm emacs-nox texlive-basic texlive-latex
              texlive-latexrecommended texlive-latexextra
              texlive-fontsrecommended
            install-more: pacman -S --noconfirm texlive-games
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs and TeX
        run: ${{ matrix.install }}

      - name: Report versions
        run: |
          emacs --version | head -1
          latex --version | head -1

      - name: Dump a .fmt file and check its stamp
        run: |
          emacs -Q -batch -L . --eval '(progn
            (require (quote latex-to-svg-backend))
            (setq latex-to-svg-backend-cache-directory
                  (expand-file-name "stamp-cache" (getenv "RUNNER_TEMP")))
            (let* ((fmt (latex-to-svg-backend--ensure-format
                         (latex-to-svg-backend--preamble)))
                   (stamp (and fmt (latex-to-svg-backend--read-format-stamp fmt))))
              (unless fmt
                (error "The dump failed"))
              (pp stamp)
              (unless (plist-get stamp :latex-fmt)
                (error "The stamp names no latex.fmt"))
              (unless (plist-get stamp :ls-r)
                (error "The stamp names no ls-R"))
              (unless (latex-to-svg-backend--format-fresh-p
                       stamp (latex-to-svg-backend--latex-binary))
                (error "A new stamp is stale"))))'

      - name: Install one more TeX package
        run: ${{ matrix.install-more }}

      - name: Check that the stamp is stale
        run: |
          emacs -Q -batch -L . --eval '(progn
            (require (quote latex-to-svg-backend))
            (setq latex-to-svg-backend-cache-directory
                  (expand-file-name "stamp-cache" (getenv "RUNNER_TEMP")))
            (let* ((fmt (latex-to-svg-backend--format-file
                         (latex-to-svg-backend--format-key
                          (latex-to-svg-backend--preamble))))
                   (stamp (latex-to-svg-backend--read-format-stamp fmt)))
              (dolist (entry (plist-get stamp :ls-r))
                (message "%s %s -> %s" (car entry)
                         (format-time-string "%F %T" (cdr entry))
                         (format-time-string
                          "%F %T" (file-attribute-modification-time
                                   (file-attributes (car entry))))))
              (when (latex-to-svg-backend--format-fresh-p
                     stamp (latex-to-svg-backend--latex-binary))
                (error "The stamp is still fresh after a TeX package was installed"))))'
